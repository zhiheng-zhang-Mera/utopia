name: PCF Linux component candidate
on:
  pull_request:
    paths:
      - 'services/personal-compute-fabric/**'
      - 'tests/pcf*.test.mjs'
      - '.github/workflows/pcf-linux-worker.yml'
jobs:
  linux-components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: node --test --test-concurrency=2 tests/pcf718-linux-worker.test.mjs tests/pcf-full-execution.test.mjs tests/pcf-stagec-service.test.mjs tests/pcf-stagec-recovery.test.mjs tests/pcf-stagec-owned-start.test.mjs tests/pcf-stagec-remote-worker.test.mjs
