<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Utopia · Knowledge Room</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="mark">U</span><span class="brand-text">UTOPIA <em>Knowledge Room</em></span></div>
  <div class="topbar-meta">
    <span id="status" role="status" aria-live="polite" class="status">loading…</span>
    <span class="local-only" title="This product only listens on 127.0.0.1">LOCAL · 127.0.0.1</span>
  </div>
</header>

<main class="layout">
  <section class="list-pane" aria-label="Knowledge list">
    <div class="pane-head">
      <div>
        <h1>Knowledge Room</h1>
        <p class="muted" id="count">0 entries</p>
      </div>
      <button class="primary" id="new-entry" type="button">＋ New Entry</button>
    </div>

    <div class="search-row">
      <label class="sr-only" for="q">Search</label>
      <input id="q" type="search" placeholder="Search title, body, tags…" autocomplete="off">
      <button id="clear-search" class="ghost" type="button" title="Clear search">✕</button>
    </div>

    <div class="tags-block">
      <span class="tags-label">Tag filter</span>
      <div id="tag-filter" class="tag-filter" role="group" aria-label="Tag filter"></div>
    </div>

    <p id="search-state" class="search-state" hidden></p>
    <ul id="list" class="entry-list"></ul>
    <div id="empty-state" class="empty-state" hidden></div>
  </section>

  <section class="editor-pane" id="editor-pane" aria-label="Entry editor">
    <div id="editor-empty" class="editor-empty">
      <h2>No entry selected</h2>
      <p class="muted">Select an entry from the list, or create a new one.</p>
    </div>

    <form id="editor" class="editor" hidden>
      <div class="editor-head">
        <p class="eyebrow" id="editor-mode">EDIT ENTRY</p>
        <p class="muted small" id="editor-meta"></p>
      </div>

      <label for="title">Title</label>
      <input id="title" name="title" type="text" required maxlength="200" autocomplete="off">

      <label for="body">Body</label>
      <textarea id="body" name="body" rows="14" spellcheck="true"></textarea>

      <label for="tags">Tags <span class="muted small">(comma separated)</span></label>
      <input id="tags" name="tags" type="text" autocomplete="off" placeholder="research, utopia">

      <p id="editor-feedback" class="feedback" role="status" aria-live="polite"></p>

      <div class="editor-actions">
        <button class="primary" id="save" type="submit">Save</button>
        <button class="danger" id="delete" type="button" hidden>Delete</button>
        <button class="ghost" id="cancel" type="button" hidden>Cancel</button>
      </div>
    </form>
  </section>
</main>

<footer class="data-bar">
  <div class="data-actions">
    <button id="export" type="button">Export JSON</button>
    <button id="import-trigger" type="button">Import JSON (replace)</button>
    <input id="import-file" type="file" accept="application/json,.json" hidden>
  </div>
  <p class="muted small" id="data-feedback" role="status" aria-live="polite"></p>
</footer>

<script type="module" src="/app.js"></script>
</body>
</html>
