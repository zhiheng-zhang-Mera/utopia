name: V0.2 checks
on: [push, pull_request]
jobs:
  gateway-web:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the promotion-history verifier walks real Git history
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      # the city tree owns its own third-party parsers (yaml, fflate, mammoth,
      # pdfjs-dist): a separate install, deliberately not a pnpm workspace
      - run: pnpm --dir city install --frozen-lockfile
      # Process-level acceptance that starts a real City. It runs as its own step, BEFORE the parallel suite, because
      # one City per host is a host-wide rule: main.mjs refuses to start while any other gateway process exists, so a
      # test that spawns a City cannot share a runner with tests that do the same. Same job, so it still gates the PR.
      - run: pnpm test:acceptance
      - run: pnpm test
      - run: node scripts/verify-promotion-history.mjs
      - run: node --test apps/rooms/tests/*.test.mjs
      - run: node city/test-all.mjs
      - run: pnpm check:docs
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain
        working-directory: apps/android
      - uses: actions/upload-artifact@v4
        with:
          name: utopia-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
